name: build-ffmpeg
on:
  push:
    branches: lgpl
    paths-ignore:
      - '**.md'
      - '**.rst'
      - '**.txt'
  release:
    types: [published]
  workflow_dispatch:
jobs:
  fan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Make cache file
        run: python scripts/cache.py
      - name: Cache tarballs
        id: cache-tarballs
        uses: actions/cache@v5
        with:
          path: source
          key: tarballs-${{ hashFiles('cache.txt') }}
      - name: Grab
        if: steps.cache-tarballs.outputs.cache-hit != 'true'
        run: python scripts/grab.py
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: deps
          path: source/*
          if-no-files-found: error
  build:
    needs: fan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            shell: bash
          - os: ubuntu-24.04
            arch: x86_64
            shell: bash
          - os: windows-latest
            arch: x86_64
            shell: 'msys2 {0}'
            msys_prefix: mingw-w64-x86_64
            msys_system: MINGW64
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Get sources
        uses: actions/download-artifact@v8
        with:
          name: deps
          path: source
      - name: Set deployment target
        if: runner.os == 'macOS'
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> $GITHUB_ENV
      - name: Install packages for macOS
        if: runner.os == 'macOS'
        run: |
          brew unlink gettext libidn2 libpng libtiff libunistring libx11 libxcb libxdmcp || true
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          install: >-
            base-devel
            ${{ matrix.msys_prefix }}-pkgconf
            ${{ matrix.msys_prefix }}-gcc
            ${{ matrix.msys_prefix }}-nasm
            ${{ matrix.msys_prefix }}-zlib
          msystem: ${{ matrix.msys_system }}
          path-type: inherit
      - name: Build FFmpeg
        env:
          CIBW_ARCHS: ${{ matrix.msys_prefix && 'AMD64' || matrix.arch }}
          CIBW_BEFORE_BUILD: python scripts/build-ffmpeg.py /tmp/vendor
          CIBW_BEFORE_BUILD_WINDOWS: python scripts\build-ffmpeg.py C:\cibw\vendor
          CIBW_BUILD: cp311-*
          # manylinux only (fetch-vendor's curl has no --fail, a missing musllinux tarball would break tar)
          CIBW_SKIP: "*musllinux*"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: LD_LIBRARY_PATH=/tmp/vendor/lib:$LD_LIBRARY_PATH auditwheel repair --exclude libmvec.so.1 --exclude libmvec-2.so --exclude libmvec.so --exclude libmvec -w {dest_dir} {wheel}
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: delvewheel repair --add-path C:\cibw\vendor\bin -w {dest_dir} {wheel}
          CIBW_TEST_COMMAND: python -c "import dummy"
        run: |
          pip install cibuildwheel delvewheel
          cibuildwheel --output-dir output
          rm -f output/*.whl
      - name: Upload FFmpeg
        uses: actions/upload-artifact@v7
        with:
          name: output-${{ matrix.os }}
          path: output/

  upload-release:
    if: github.event_name == 'release'
    needs: [fan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download the builds
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          pattern: output-*
          merge-multiple: true
      - name: Download the sources
        uses: actions/download-artifact@v8
        with:
          name: deps
          path: source/
      - name: Write SOURCE.txt
        run: python scripts/source_txt.py artifacts source "${{ github.server_url }}/${{ github.repository }}" "${{ github.sha }}" "${{ github.ref_name }}" > SOURCE.txt
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.tar.gz
            source/*
            SOURCE.txt
